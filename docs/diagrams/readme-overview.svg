<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">깐부.GG 기능 요약</title><desc id="desc">리그 오브 레전드 경기 데이터를 바탕으로 아군·상대 조합과 포지션에 맞는 챔피언 선택을 돕는 웹 서비스입니다. 조건 선택: 내 포지션·아군·상대: 소환사명으로 숙련도 → 통계 비교: 조합 승률·라인전: 숙련도를 반영한 점수 → 챔피언 추천: 조건별 후보 확인: 챔피언 통계 탐색 설명용 도식입니다.</desc><rect width="1200" height="720" rx="24" fill="#F0F1FF"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, Arial, sans-serif" fill="#292958"><rect x="52" y="47" width="7" height="25" rx="3" fill="#6561D9"/><text x="74" y="67" font-size="21" font-weight="600" fill="#6561D9">SSAFY 7기 2학기 팀 프로젝트 · 게임 데이터</text><text x="52" y="148" font-size="58" font-weight="800" letter-spacing="-2">깐부.GG</text><text x="54" y="203" font-size="28" letter-spacing="-.6">팀 조합과 상대를 보고, 챔피언 선택의 근거를 찾습니다.</text><text x="54" y="257" font-size="17" letter-spacing="3" fill="#6561D9">HOW IT WORKS</text><g transform="translate(52,280)"><rect width="356" height="315" rx="20" fill="white"/><rect x="20" y="20" width="39" height="29" rx="8" fill="#DDDFFD"/><text x="39.5" y="41" text-anchor="middle" font-size="16" font-weight="700" fill="#6561D9">01</text><g transform="translate(60,51)"><g transform="translate(40,8)"><rect x="0" y="0" width="48" height="80" rx="6" fill="none" stroke="#6561D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="24" r="10" fill="#6561D9" opacity=".4"/><path d="M11 48h26 M11 62h18" fill="none" stroke="#6561D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(97,18)"><rect x="0" y="0" width="48" height="80" rx="6" fill="none" stroke="#6561D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="24" r="10" fill="#6561D9" opacity=".4"/><path d="M11 48h26 M11 62h18" fill="none" stroke="#6561D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(154,8)"><rect x="0" y="0" width="48" height="80" rx="6" fill="none" stroke="#6561D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="24" r="10" fill="#6561D9" opacity=".4"/><path d="M11 48h26 M11 62h18" fill="none" stroke="#6561D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="28" y="207" font-size="30" font-weight="700" letter-spacing="-1">조건 선택</text><text x="28" y="248" font-size="23">내 포지션·아군·상대</text><text x="28" y="281" font-size="23" fill="#6561D9">소환사명으로 숙련도</text></g><g transform="translate(422,280)"><rect width="356" height="315" rx="20" fill="white"/><rect x="20" y="20" width="39" height="29" rx="8" fill="#DDDFFD"/><text x="39.5" y="41" text-anchor="middle" font-size="16" font-weight="700" fill="#6561D9">02</text><g transform="translate(60,51)"><rect x="74" y="22" width="80" height="12" rx="6" fill="#6561D9" opacity="1"/><rect x="74" y="47" width="58" height="12" rx="6" fill="#6561D9" opacity="0.8"/><rect x="74" y="72" width="100" height="12" rx="6" fill="#6561D9" opacity="0.6"/></g><text x="28" y="207" font-size="30" font-weight="700" letter-spacing="-1">통계 비교</text><text x="28" y="248" font-size="23">조합 승률·라인전</text><text x="28" y="281" font-size="23" fill="#6561D9">숙련도를 반영한 점수</text></g><g transform="translate(792,280)"><rect width="356" height="315" rx="20" fill="white"/><rect x="20" y="20" width="39" height="29" rx="8" fill="#DDDFFD"/><text x="39.5" y="41" text-anchor="middle" font-size="16" font-weight="700" fill="#6561D9">03</text><g transform="translate(60,51)"><g transform="translate(40,8)"><rect x="0" y="0" width="48" height="80" rx="6" fill="none" stroke="#6561D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="24" r="10" fill="#6561D9" opacity=".4"/><path d="M11 48h26 M11 62h18" fill="none" stroke="#6561D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(97,18)"><rect x="0" y="0" width="48" height="80" rx="6" fill="none" stroke="#6561D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="24" r="10" fill="#6561D9" opacity=".4"/><path d="M11 48h26 M11 62h18" fill="none" stroke="#6561D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(154,8)"><rect x="0" y="0" width="48" height="80" rx="6" fill="none" stroke="#6561D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="24" r="10" fill="#6561D9" opacity=".4"/><path d="M11 48h26 M11 62h18" fill="none" stroke="#6561D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="28" y="207" font-size="30" font-weight="700" letter-spacing="-1">챔피언 추천</text><text x="28" y="248" font-size="23">조건별 후보 확인</text><text x="28" y="281" font-size="23" fill="#6561D9">챔피언 통계 탐색</text></g><line x1="54" y1="629" x2="1146" y2="629" stroke="#6561D9" opacity=".2"/><text x="54" y="668" font-size="20" fill="#6561D9">경기 통계 기반 점수 계산 · 웹캠 이미지 분류는 별도 콘텐츠</text><text x="1145" y="701" text-anchor="end" font-size="12" letter-spacing="1.4" opacity=".65">FEATURE OVERVIEW · NOT A LIVE SCREENSHOT</text></g></svg>